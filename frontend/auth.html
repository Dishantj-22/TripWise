<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripWise - Access Your Journey</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0d0d0d;
        }
    </style>
</head>
<body class="text-gray-200 antialiased min-h-screen flex flex-col justify-between bg-cover bg-center relative" style="background-image: linear-gradient(to bottom, rgba(13,13,13,0.85), #0d0d0d), url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80');">

    <!-- Header Logo Area -->
    <header class="w-full max-w-7xl mx-auto px-6 h-20 flex items-center justify-between z-10">
        <a href="index.html" class="text-2xl font-bold text-white tracking-wide">
            <i class="fa-solid fa-arrow-left text-sm mr-3 text-zinc-500 hover:text-white transition"></i>Trip<span class="text-purple-500">Wise</span>
        </a>
    </header>

    <!-- Authentication Card Wrapper -->
    <main class="flex-grow flex items-center justify-center px-4 py-12 z-10">
        <div class="w-full max-w-md bg-[#141414] border border-zinc-800/80 rounded-3xl p-8 shadow-2xl backdrop-blur-md relative">
            
            <!-- LOGIN FORM VIEW -->
            <div id="login-view">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold text-white mb-2">Welcome Back</h2>
                    <p class="text-xs text-zinc-400">Enter your credentials to access your saved trips.</p>
                </div>

                <form class="space-y-4" onsubmit="event.preventDefault();">
                    <div>
                        <label class="block text-xs font-medium text-zinc-400 uppercase tracking-wider mb-2">Email Address</label>
                        <div class="relative">
                            <input type="email" placeholder="name@example.com" class="w-full bg-[#0d0d0d] border border-zinc-800 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-purple-500 transition">
                            <i class="fa-solid fa-envelope absolute left-3.5 top-4 text-zinc-600 text-xs"></i>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-xs font-medium text-zinc-400 uppercase tracking-wider">Password</label>
                            <a href="#" class="text-[11px] text-purple-400 hover:underline">Forgot password?</a>
                        </div>
                        <div class="relative">
                            <input type="password" placeholder="••••••••" class="w-full bg-[#0d0d0d] border border-zinc-800 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-purple-500 transition">
                            <i class="fa-solid fa-lock absolute left-3.5 top-4 text-zinc-600 text-xs"></i>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold text-sm py-3.5 rounded-xl transition shadow-lg shadow-purple-600/20 mt-2">
                        Sign In
                    </button>
                </form>

                <div class="text-center mt-6 pt-6 border-t border-zinc-800/60">
                    <p class="text-xs text-zinc-400">Don't have an account? <button onclick="toggleView('signup')" class="text-purple-400 font-medium hover:underline focus:outline-none">Sign up</button></p>
                </div>
            </div>

            <!-- SIGN UP FORM VIEW -->
            <div id="signup-view" class="hidden">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold text-white mb-2">Create Account</h2>
                    <p class="text-xs text-zinc-400">Join TripWise and unlock handpicked global adventures.</p>
                </div>

                <form class="space-y-4" onsubmit="event.preventDefault();">
                    <div>
                        <label class="block text-xs font-medium text-zinc-400 uppercase tracking-wider mb-2">Full Name</label>
                        <div class="relative">
                            <input type="text" placeholder="John Doe" class="w-full bg-[#0d0d0d] border border-zinc-800 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-purple-500 transition">
                            <i class="fa-solid fa-user absolute left-3.5 top-4 text-zinc-600 text-xs"></i>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-zinc-400 uppercase tracking-wider mb-2">Email Address</label>
                        <div class="relative">
                            <input type="email" placeholder="name@example.com" class="w-full bg-[#0d0d0d] border border-zinc-800 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-purple-500 transition">
                            <i class="fa-solid fa-envelope absolute left-3.5 top-4 text-zinc-600 text-xs"></i>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-medium text-zinc-400 uppercase tracking-wider mb-2">Create Password</label>
                        <div class="relative">
                            <input type="password" placeholder="Minimum 8 characters" class="w-full bg-[#0d0d0d] border border-zinc-800 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-zinc-600 focus:outline-none focus:border-purple-500 transition">
                            <i class="fa-solid fa-lock absolute left-3.5 top-4 text-zinc-600 text-xs"></i>
                        </div>
                    </div>

                    <div class="flex items-start items-center pt-2">
                        <input id="terms" type="checkbox" class="w-4 h-4 rounded bg-[#0d0d0d] border-zinc-800 text-purple-600 focus:ring-0 accent-purple-600">
                        <label for="terms" class="ml-2 text-[11px] text-zinc-400 leading-none">I agree to the <a href="#" class="text-purple-400 hover:underline">Terms & Conditions</a></label>
                    </div>

                    <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold text-sm py-3.5 rounded-xl transition shadow-lg shadow-purple-600/20 mt-2">
                        Get Started
                    </button>
                </form>

                <div class="text-center mt-6 mt-6 pt-6 border-t border-zinc-800/60">
                    <p class="text-xs text-zinc-400">Already have an account? <button onclick="toggleView('login')" class="text-purple-400 font-medium hover:underline focus:outline-none">Login</button></p>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer Copyright -->
    <footer class="w-full max-w-7xl mx-auto px-6 py-6 text-center text-[11px] text-zinc-600 z-10">
        &copy; @2026Tripsy. All Rights Reserved.
    </footer>

    <!-- View Handling Script -->
    <script>
        function toggleView(view) {
            const loginView = document.getElementById('login-view');
            const signupView = document.getElementById('signup-view');
            
            if (view === 'login') {
                loginView.classList.remove('hidden');
                signupView.classList.add('hidden');
                document.title = "TripWise - Login";
            } else {
                loginView.classList.add('hidden');
                signupView.classList.remove('hidden');
                document.title = "TripWise - Sign Up";
            }
        }

        // URL Parameter handling to know which form view to show first
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const mode = params.get('mode');
            if (mode === 'signup') {
                toggleView('signup');
            } else {
                toggleView('login');
            }
        });
    </script>
</body>
</html>
